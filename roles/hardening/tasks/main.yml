---
- name: Install the login banner
  ansible.builtin.template:
    src: banner.j2
    dest: /etc/issue.net
    owner: root
    group: root
    mode: "0644"

- name: Install the sshd configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Install procps
  ansible.builtin.package:
    name: "{{ 'procps' if ansible_os_family == 'Debian' else 'procps-ng' }}"
    state: present

- name: Create the sysctl directory
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the sysctl drop-in
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-configfleet.conf
    owner: root
    group: root
    mode: "0644"

- name: Load sysctl settings
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-configfleet.conf
  changed_when: false

- name: Set password aging defaults
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?{{ hardening_aging.key }}\\s+"
    line: "{{ hardening_aging.key }}    {{ hardening_aging.value }}"
  loop:
    - key: PASS_MAX_DAYS
      value: "{{ hardening_pass_max_days }}"
    - key: PASS_MIN_DAYS
      value: "{{ hardening_pass_min_days }}"
    - key: PASS_WARN_AGE
      value: "{{ hardening_pass_warn_age }}"
  loop_control:
    loop_var: hardening_aging
    label: "{{ hardening_aging.key }}"

- name: Tighten permissions on account files
  ansible.builtin.file:
    path: "{{ hardening_sensitive.path }}"
    mode: "{{ hardening_sensitive.mode }}"
  loop:
    - path: /etc/passwd
      mode: "0644"
    - path: /etc/shadow
      mode: "0640"
    - path: /etc/group
      mode: "0644"
    - path: /etc/gshadow
      mode: "0640"
  loop_control:
    loop_var: hardening_sensitive
    label: "{{ hardening_sensitive.path }}"

- name: Collect installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Remove unwanted packages when they are installed
  ansible.builtin.package:
    name: "{{ hardening_unwanted }}"
    state: absent
  loop: "{{ hardening_remove_packages }}"
  loop_control:
    loop_var: hardening_unwanted
    label: "{{ hardening_unwanted }}"
  when: hardening_unwanted in ansible_facts.packages

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Disable unused services when they are installed
  ansible.builtin.systemd:
    name: "{{ hardening_service }}"
    enabled: false
    state: stopped
  loop: "{{ hardening_disable_services }}"
  loop_control:
    loop_var: hardening_service
    label: "{{ hardening_service }}"
  when: (hardening_service ~ '.service') in ansible_facts.services

- name: Read the active sshd configuration
  ansible.builtin.command:
    cmd: sshd -T
  register: hardening_sshd_effective
  changed_when: false
  check_mode: false

- name: Restart sshd when the active configuration is stale
  ansible.builtin.service:
    name: "{{ hardening_ssh_service }}"
    state: restarted
  when:
    - not ansible_check_mode
    - >-
      ("permitrootlogin " ~ hardening_permit_root_login) not in hardening_sshd_effective.stdout
      or ("passwordauthentication " ~ hardening_password_authentication)
      not in hardening_sshd_effective.stdout

- name: Configure the host firewall
  ansible.builtin.include_tasks: firewall.yml
  when: hardening_manage_firewall | bool
