---
all:
  children:
    ubuntu:
      hosts:
        dev-ubuntu-1:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: "{{ lookup('env', 'CONFIGFLEET_SSH_KEY') | default('/tmp/configfleet-unused', true) }}"
          ansible_ssh_common_args: >-
            -o UserKnownHostsFile={{ lookup('env', 'CONFIGFLEET_KNOWN_HOSTS') | default('/dev/null', true) }}
            -o IdentitiesOnly=yes
    centos:
      hosts:
        dev-centos-1:
          ansible_host: 127.0.0.1
          ansible_port: 2223
          ansible_user: ansible
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_private_key_file: "{{ lookup('env', 'CONFIGFLEET_SSH_KEY') | default('/tmp/configfleet-unused', true) }}"
          ansible_ssh_common_args: >-
            -o UserKnownHostsFile={{ lookup('env', 'CONFIGFLEET_KNOWN_HOSTS') | default('/dev/null', true) }}
            -o IdentitiesOnly=yes
